name: picksy-stage2

# 기존 검증 런타임을 소스 마운트로 재사용한다. 새 빌드·모델 다운로드는 없다.
x-python: &python
  image: sha256:c6632d172bb586d377bfebd7625348f1daf981818f325338c125f92aeab9f41f
  pull_policy: never
  platform: linux/amd64
  entrypoint: [python, -B, -u]
  working_dir: /stage2
  read_only: true
  tmpfs: [/tmp:size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  labels:
    io.picksy.stage2: "true"
  dns_opt: [timeout:1, attempts:1]
  stop_grace_period: 180s
  volumes:
    - type: bind
      source: .
      target: /stage2
      read_only: true
      bind:
        create_host_path: false

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: "no"
    labels:
      io.picksy.stage2: "true"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    # CA 개인키는 호스트/볼륨에 보존하지 않는다. 재시작 시 CA를 다시 읽는다.
    tmpfs: [/data:size=16m, /config:size=4m, /tmp:size=4m]
    environment:
      STAGE2_PRIVATE_IP: ${STAGE2_GATEWAY_PREFIX:-172.30.241}.2
      STAGE2_ADMIN_IP: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.2
      STAGE2_CONTROLLER_IP: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.3
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${STAGE2_BIND:-127.0.0.1}:${STAGE2_HTTPS_PORT:-18080}:443"
    networks:
      ingress: {}
      gateways:
        ipv4_address: ${STAGE2_GATEWAY_PREFIX:-172.30.241}.2
      inference: {}
      management:
        ipv4_address: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.2

  controller:
    <<: *python
    command: [/stage2/controller.py]
    mem_limit: 128m
    environment:
      STAGE2_ADMIN_IP: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.2
      STAGE2_CONTROLLER_IP: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.3
    networks:
      gateways: {}
      inference: {}
      management:
        ipv4_address: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.3

  gateway:
    <<: *python
    command: [/stage2/server.py, gateway]
    mem_limit: 128m
    environment:
      STAGE2_API_KEY: ${STAGE2_API_KEY:?런타임에서 실험 API 키를 생성해야 합니다}
      STAGE2_PRIVATE_IP: ${STAGE2_GATEWAY_PREFIX:-172.30.241}.2
      STAGE2_START_HELD: ${STAGE2_START_HELD:-0}
    networks: [gateways]

  inference:
    <<: *python
    command: [/stage2/server.py, inference]
    cpus: 4
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/huggingface
      STAGE2_START_HELD: ${STAGE2_START_HELD:-0}
    volumes:
      - type: bind
        source: .
        target: /stage2
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGE2_MODEL_DIR:?Q4 모델 디렉터리의 절대 경로가 필요합니다}
        target: /models/decider
        read_only: true
        bind:
          create_host_path: false
    networks: [inference]

networks:
  ingress: {}
  gateways:
    internal: true
    ipam:
      config:
        - subnet: ${STAGE2_GATEWAY_PREFIX:-172.30.241}.0/24
  inference:
    internal: true
    ipam:
      config:
        - subnet: ${STAGE2_INFERENCE_PREFIX:-172.30.242}.0/24
  management:
    internal: true
    ipam:
      config:
        - subnet: ${STAGE2_MANAGEMENT_PREFIX:-172.30.243}.0/24
